; Exemple de build local pour la librairie TelegramSender
; Compile :  pio run                 (ESP8266 + ESP32)
;            pio run -e nodemcuv2    (ESP8266 uniquement)
;            pio run -e esp32dev     (ESP32 uniquement)

[platformio]
src_dir = .

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

lib_deps =
    file://../../

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    file://../../
