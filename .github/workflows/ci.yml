name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [nodemcuv2, esp32dev]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --user platformio

      - name: Build example (${{ matrix.env }})
        working-directory: examples/TelegramDemo
        run: pio run -e ${{ matrix.env }}
