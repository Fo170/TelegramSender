paragraph=Une seule fonction synchrone sendMessage() avec TLS par certificat (Go Daddy Root CA en PROGMEM) et codes retour precis (TelegramError) sans allocation heap. Le token/chat ID se definissent a la compilation (jamais en clair). La gestion avancee (queue/retry/throttling) vit dans une librairie de plus haut niveau.
