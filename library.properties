paragraph=sendMessage() synchrone + polling getUpdatesBody() sur une session TLS PERSISTANTE (un seul handshake, requetes HTTP/1.1 keep-alive, plus de fragmentation du heap), TLS par certificat (Go Daddy Root CA en PROGMEM) et codes retour precis (TelegramError). v1.3.1 : lecture/ecriture robuste (attente de la reponse, boucle d'ecriture anti-ecriture partielle, ordre setNoDelay/setTimeout corrige sur ESP32). Le token/chat ID se definissent a la compilation (jamais en clair). La gestion avancee (queue/retry/throttling) vit dans une librairie de plus haut niveau.
